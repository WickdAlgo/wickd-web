name: CI

on:
  # All three long-lived branches. `dev` takes direct pushes, so push CI is the
  # only gate it has; `main` and `stage` require the `verify` check below to
  # merge, and push CI covers the rare ruleset-bypassing commit.
  push:
    branches: [main, stage, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Before the build: the unit suite runs in seconds and the OpenNext
      # bundle takes about a minute, so a logic regression should not wait for
      # a bundle it is going to invalidate.
      - run: pnpm test

      - run: pnpm build

      - name: Validate design-system components
        run: bash .claude/skills/add-ui-component/scripts/validate.sh

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Reuses the `.next/` output `pnpm build` already produced, so this
      # serves the same artifact the Worker would.
      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
